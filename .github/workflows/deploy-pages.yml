name: Deploy to GitHub Pages

# Build and deploy on push to main/develop, or on manual dispatch.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Permissions required for the github-pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; cancel in-progress runs of the same workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect repo name for basePath
        id: pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "Building for /$REPO_NAME"

      - name: Verify cached data + icons are committed
        run: |
          set -e
          test -f public/data/satisfactory.json || { echo "::error::public/data/satisfactory.json missing. Run 'npm run refresh' locally and commit."; exit 1; }
          test -f public/data/version.json || { echo "::error::public/data/version.json missing. Run 'npm run data' locally and commit."; exit 1; }
          test "$(ls public/icons/items | wc -l)" -gt 100 || { echo "::error::Item icons missing. Run 'npm run icons' locally and commit."; exit 1; }

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ steps.pages.outputs.repo_name }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run so you don't have to flip the
          # Settings → Pages switch manually before the first deploy.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
